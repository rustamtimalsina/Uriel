version: "3.8"

services:
  uriel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:10000"
    volumes:
      - ./data:/app/data
      - ./backend/app/data:/app/backend/app/data
    environment:
      - PORT=10000
      - DB_PATH=/app/backend/app/data/uriel.db
      - DATA_DIR=/app/data/documents
      - AUTO_INDEX_ON_STARTUP=true
      - ENABLE_FILE_WATCHER=true
    restart: unless-stopped
